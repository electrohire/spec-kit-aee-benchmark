name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run pytest -q
      - run: uv run aee-bench dry-run manifests/offline-freeze.json > /tmp/schedule.json
      - run: uv run python scripts/check_evidence.py
      - run: uv run maintenance-triage examples/maintenance_triage/sample.csv /tmp/triage.json
      - run: diff examples/maintenance_triage/sample.json /tmp/triage.json
