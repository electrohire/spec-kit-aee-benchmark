name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --locked --group dev --python 3.12
      - run: uv run pytest -q
      # Historical manifests remain immutable; validate the current checkout separately.
      - run: uv run aee-bench freeze /tmp/ci-freeze.json
      - run: uv run aee-bench dry-run /tmp/ci-freeze.json > /tmp/schedule.json
      - run: uv run python scripts/check_evidence.py
      - run: uv run python scripts/audit_stopped_postmortem.py
      # Recorded pins must match the vendored extension bytes (FR-7.2).
      - run: uv run python scripts/check_pins.py
      - run: uv run python scripts/readme_results.py --check
      - run: uv run maintenance-triage examples/maintenance_triage/sample.csv /tmp/triage.json
      - run: diff examples/maintenance_triage/sample.json /tmp/triage.json
