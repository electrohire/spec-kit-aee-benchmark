name: Verify benchmark release evidence
on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
      artifact_sha256:
        type: string
        required: true
permissions:
  contents: read
jobs:
  benchmark-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: electrohire/spec-kit-aee-benchmark
          ref: ee2604d6d22a350f3ef1a34ed936557e79c0bbd6
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require exact-build audited matched benchmark approval
        env:
          COMPONENT_REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: |
          python scripts/verify_release_benchmarks.py --repository "$COMPONENT_REPOSITORY" --commit "$CANDIDATE_SHA" --artifact-sha256 "$ARTIFACT_SHA256" > benchmark-release-decision.json
          cat benchmark-release-decision.json >> "$GITHUB_STEP_SUMMARY"
